name: nikkei-signal-monitor

on:
  schedule:
    # 平日の大引け後(日本時間 15:45)に1日1回実行
    - cron: '45 6 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '休場日でも実行する(テスト用)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-signals:
    runs-on: ubuntu-latest
    steps:
      - name: setup checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install requirements
        run: pip install -r requirements.txt

      - name: run signal check
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: python main.py ${{ inputs.force && '--force' || '' }}

      - name: save positions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add positions.csv
          if ! git diff --cached --quiet; then
            git commit -m "update positions"
            git pull --rebase
            git push
          else
            echo "変更なし、コミットをスキップします"
          fi
